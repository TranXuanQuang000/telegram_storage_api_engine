openapi: 3.1.0
info:
  title: App Truyen Nova API
  version: 1.0.0
paths:
  /api/v1/stories:
    get:
      summary: Get list of stories
      responses:
        '200':
          description: A list of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Story'
  /api/v1/stories/{id}/chapters:
    get:
      summary: Get chapters for a story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
  /api/v1/admin/canvas-nodes:
    get:
      summary: Get data for React Flow Canvas
      responses:
        '200':
          description: Nodes and edges for canvas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasGraph'
  /api/v1/admin/merge:
    post:
      summary: Merge multiple chapters/stories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: Merge successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/health:
    get:
      summary: Get system health and metrics
      responses:
        '200':
          description: Health metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthMetrics'

components:
  schemas:
    Story:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: "Story ID"
          example: "story_123"
        title:
          type: string
          description: "Story title"
          example: "One Piece"
        author:
          type: string
          description: "Author name"
          example: "Eiichiro Oda"
      required:
        - id
        - title
        - author
    Chapter:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: "Chapter ID"
          example: "chap_1"
        title:
          type: string
          description: "Chapter title"
          example: "Romance Dawn"
        consent_status:
          type: string
          description: "Status of consent"
          enum: [VERIFIED, FLAG, UNKNOWN]
          example: "VERIFIED"
      required:
        - id
        - title
        - consent_status
    CanvasGraph:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                description: Node ID
                example: "node_1"
              type:
                type: string
                description: Node type
                example: "chapter"
            required:
              - id
              - type
        edges:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                description: Edge ID
                example: "edge_1"
              source:
                type: string
                description: Source node ID
                example: "node_1"
              target:
                type: string
                description: Target node ID
                example: "node_2"
            required:
              - id
              - source
              - target
      required:
        - nodes
        - edges
    MergeRequest:
      type: object
      additionalProperties: false
      properties:
        sourceIds:
          type: array
          items:
            type: string
          description: List of IDs to merge
          example: ["id1", "id2"]
        targetId:
          type: string
          description: The target ID to merge into
          example: "id1"
      required:
        - sourceIds
        - targetId
    SuccessResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          description: "Success status"
          example: true
      required:
        - success
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          description: "Error message"
          example: "Invalid merge request"
        code:
          type: string
          description: "Error code"
          example: "ERR_BAD_REQUEST"
        details:
          type: object
          description: "Additional error details"
          additionalProperties: true
      required:
        - error
        - code
    HealthMetrics:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: System status
          example: "healthy"
        error_rate:
          type: number
          description: Current error rate percentage
          example: 5.2
      required:
        - status
        - error_rate
